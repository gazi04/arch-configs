# ----------------------------------------------------
# 1. Configuration for Mouse Support
# ----------------------------------------------------
set -g mouse on
set -g history-limit 5000

# ----------------------------------------------------
# 2. Configuration for Status Bar Position
# ----------------------------------------------------
set -g status-position top

# ----------------------------------------------------
# 3. Leader Key change
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# ----------------------------------------------------

# ----------------------------------------------------
# 4. Jump between sessions without the prefix (Alt + number)
#    Alt+N goes to the N-th oldest open session, whatever its name.
#    Numbers shift down when an older session is closed.
# ----------------------------------------------------
bind -n M-1 run-shell -b "~/.config/tmux/switch-nth-session.sh 1 '#{client_name}'"
bind -n M-2 run-shell -b "~/.config/tmux/switch-nth-session.sh 2 '#{client_name}'"
bind -n M-3 run-shell -b "~/.config/tmux/switch-nth-session.sh 3 '#{client_name}'"
bind -n M-4 run-shell -b "~/.config/tmux/switch-nth-session.sh 4 '#{client_name}'"
bind -n M-5 run-shell -b "~/.config/tmux/switch-nth-session.sh 5 '#{client_name}'"
bind -n M-6 run-shell -b "~/.config/tmux/switch-nth-session.sh 6 '#{client_name}'"
bind -n M-7 run-shell -b "~/.config/tmux/switch-nth-session.sh 7 '#{client_name}'"
bind -n M-8 run-shell -b "~/.config/tmux/switch-nth-session.sh 8 '#{client_name}'"
bind -n M-9 run-shell -b "~/.config/tmux/switch-nth-session.sh 9 '#{client_name}'"

# Status bar: numbered list of sessions in the same order, current one
# highlighted, e.g.  1:nvim  2:git [3:server] 4:ai
set -g status-left-length 120
set -g status-left "#{S/i: #{e|+:#{loop_index},1}:#{session_name} ,#[reverse bold] #{e|+:#{loop_index},1}:#{session_name} #[default]} "

# Redraw every client's status bar right away when the session list changes
# (otherwise it waits for the next status-interval tick)
set-hook -g session-created 'run-shell -b "tmux list-clients -F \"##{client_name}\" | xargs -r -I{} tmux refresh-client -S -t {}"'
set-hook -g session-closed 'run-shell -b "tmux list-clients -F \"##{client_name}\" | xargs -r -I{} tmux refresh-client -S -t {}"'
set-hook -g session-renamed 'run-shell -b "tmux list-clients -F \"##{client_name}\" | xargs -r -I{} tmux refresh-client -S -t {}"'

# ----------------------------------------------------
# 5. Splits open in the current directory (prefix | and prefix -)
# ----------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ----------------------------------------------------
# 6. Shared navigation with Neovim (vim-tmux-navigator)
#    Ctrl + h/j/k/l moves between Neovim splits and tmux panes.
#    Inside Neovim the keys are passed through; the plugin hands over to
#    tmux at the edge of the Neovim window.
# ----------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
# Claude Code uses Ctrl + j for a new line: pass it through there
# (prefix + Down still moves down from a Claude pane)
bind -n C-j if-shell -F '#{==:#{pane_current_command},claude}' 'send-keys C-j' \
    "if-shell \"$is_vim\" 'send-keys C-j' 'select-pane -D'"
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Alt + arrows do the same as Ctrl + h/j/k/l (also from a Claude pane)
bind -n M-Left  if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind -n M-Down  if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind -n M-Up    if-shell "$is_vim" 'send-keys M-Up'    'select-pane -U'
bind -n M-Right if-shell "$is_vim" 'send-keys M-Right' 'select-pane -R'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl + l is taken for navigation: prefix Ctrl + l clears the screen instead
bind C-l send-keys C-l
